[keys]
prefix = "f12"
new_workspace = ["prefix+shift+n", "cmd+n"]
close_workspace = ["prefix+shift+d", "cmd+w"]
new_tab = ["prefix+c", "cmd+t"]
close_tab = "prefix+shift+x"
split_vertical = ["prefix+v", "cmd+d"]

[[keys.command]]
key = "cmd+i"
type = "shell"
command = "~/.config/herdr/scripts/hunk-review.sh"
description = "review current changes in a side pane"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "luiul.agent-radar.open-radar"
description = "open Agent Radar (agents running outside herdr)"

[ui]
agent_panel_sort = "spaces"
