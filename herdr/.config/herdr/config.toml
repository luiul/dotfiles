[keys]
prefix = "f12"
new_workspace = ["prefix+shift+n", "cmd+n"]
close_workspace = ["prefix+shift+d", "cmd+w"]
new_tab = ["prefix+c", "cmd+t"]
close_tab = "prefix+shift+x"
split_vertical = ["prefix+v", "cmd+d"]

[[keys.command]]
key = "cmd+i"
type = "shell"
command = '''
set -e
PANE_ID=$(herdr pane split \
	--pane "$HERDR_ACTIVE_PANE_ID" \
	--direction right \
	--ratio 0.4 \
	--cwd "$HERDR_ACTIVE_PANE_CWD" \
	--focus | jq -r '.result.pane.pane_id')
herdr pane run "$PANE_ID" "hunk diff --watch"
'''
description = "review current changes in a side pane"
