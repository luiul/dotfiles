# Centralize every worktree under ~/worktrees instead of scattering them as siblings of each
# repo (would clutter shared dirs like ~/projects/hellofresh/) or nesting them inside the repo
# (risky on a shared monorepo like tardis-community without a local core.excludesFile on every
# machine).
#
# Branch as the PARENT segment and repo as the LEAF (not the more obvious owner/repo/branch) is
# deliberate: pi's memory/skill system (pi-hermes-memory) detects "project" as nothing more than
# path.basename(cwd) at session start, with no override hook. A worktree path ending in the
# branch name (…/tardis-community/fix-thing) would make every worktree its own disconnected
# memory/skill bucket named after the branch, fragmenting everything already recorded under the
# main checkout's bucket (named after the repo). Ending in the repo name instead
# (…/fix-thing/tardis-community) makes every worktree of a repo resolve to the SAME project
# bucket as the main checkout, so memory/skills stay unified across the whole repo regardless of
# which branch/worktree pi was launched from. VS Code's title bar (below) carries the branch
# distinction instead, since the folder name no longer does.
worktree-path = "~/worktrees/{{ owner }}/{{ branch | sanitize }}/{{ repo }}"

# Keep the default branch fresh before it becomes the base of a new worktree/branch -- the same
# habit as `gpull` (fetch + fast-forward), but scoped to worktree creation instead of a manual
# alias. Guarded on `target_worktree_path` being unset, since that's only true when `wt switch`
# is about to CREATE a worktree, not when switching between existing ones -- otherwise this would
# fire (and hit the network) on every `wt switch`. Deliberately targets the default branch, not
# `{{ base }}`: in a pre-switch hook, `base`/`base_worktree_path` mean "the worktree you're
# switching FROM", not "what the new branch will fork from" (that's only correct in pre-start,
# which fires after the worktree/branch already exists -- too late to freshen anything).
# worktree_path_of_branch() finds wherever the default branch is actually checked out (usually
# the main checkout, but not necessarily) and fast-forwards it there; falls back to updating the
# ref directly when nobody has it checked out. Best-effort (`|| true`): a flaky/offline fetch
# should never block creating a worktree, just skip the freshen.
[pre-switch]
sync-default = '''
{% if not target_worktree_path %}
{% set p = worktree_path_of_branch(default_branch) %}
{% if p %}
git -C "{{ p }}" fetch --prune && git -C "{{ p }}" pull --ff-only || true
{% else %}
git fetch origin "{{ default_branch }}:{{ default_branch }}" || true
{% endif %}
{% endif %}
'''

# .venv is symlinked (below); skip it in copy-ignored so we don't try to reflink it too.
# .cop-prompt is written into a fresh worktree by the pi-prompt post-switch hook (below);
# never let a stray one in the main checkout get reflinked over the one the hook just wrote.
[step.copy-ignored]
exclude = [".venv/", ".DS_Store", ".cop-prompt"]

# Symlink .venv (shared, handled separately), copy other gitignored files (.vscode/settings.json,
# .env, etc.) via reflink, open the new worktree in VS Code, register the repo so `coppice list`
# (or `coppice remove`) can find its worktrees later from anywhere, and register+build+watch the worktree
# in code-review-graph so its branch-specific code graph is queryable/kept fresh like the main
# repo's. Guarded by `command -v` so this is a no-op on machines without code-review-graph.
[post-start]
venv = "ln -sfn {{ repo_path }}/.venv {{ worktree_path }}/.venv"
copy = "wt step copy-ignored --force"
# When `cop new --prompt` set COP_PROMPT, the pi-prompt post-switch hook (below) opens the
# window instead; skip here so create-with-prompt opens exactly one window, not two.
vscode = '[ -n "$COP_PROMPT" ] || code -n {{ worktree_path }}'
registry = "mkdir -p ~/.cache/wt && echo '{{ repo_path }}' >> ~/.cache/wt/known-repos && sort -u -o ~/.cache/wt/known-repos ~/.cache/wt/known-repos"
# pi/Claude discover AGENTS.md/CLAUDE.md by walking up from cwd to the filesystem root,
# concatenating every match along the way. From the main checkout ({{ repo_path }}, e.g.
# ~/projects/hellofresh/tardis-community) that walk passes through ~/projects/hellofresh/ and
# picks up its org-level AGENTS.md/CLAUDE.md. A worktree lives in a disjoint tree
# (~/worktrees/hellofresh/<branch>/tardis-community) whose walk-up never passes through
# ~/projects/hellofresh/, so that file is silently missing there.
#
# Fix: search upward from the main checkout's PARENT directory for the nearest AGENTS.md and
# CLAUDE.md, stopping at $HOME (whatever sits at/above $HOME is already found identically by
# both walks, since both the checkout and the worktree live under $HOME). Deliberately does not
# assume the file is exactly one level up -- some repos may be nested deeper (e.g. a subgroup
# directory) or have no such file at all, in which case this is a silent no-op. Whatever is
# found is symlinked into {{ owner }}'s worktree root (one level above every branch dir for this
# owner), which is exactly the directory pi's walk-up passes through for every worktree of every
# repo under this owner -- so this only needs to run (idempotently) once per owner, not per branch.
agents-md = '''
home="$HOME"
owner_dir=$(dirname "$(dirname "{{ worktree_path }}")")
for name in AGENTS.md CLAUDE.md; do
  dir=$(dirname "{{ repo_path }}")
  found=""
  while [ "$dir" != "$home" ] && [ "$dir" != "/" ]; do
    if [ -f "$dir/$name" ]; then
      found="$dir/$name"
      break
    fi
    parent=$(dirname "$dir")
    [ "$parent" = "$dir" ] && break
    dir="$parent"
  done
  [ -n "$found" ] && ln -sf "$found" "$owner_dir/$name"
done
'''
crg = '''
if command -v code-review-graph >/dev/null 2>&1; then
  code-review-graph register "{{ worktree_path }}" --alias "{{ repo }}-{{ branch | sanitize }}" >/dev/null 2>&1
  ( cd "{{ worktree_path }}" && code-review-graph build >/dev/null 2>&1 )
  command -v crg-daemon >/dev/null 2>&1 && crg-daemon add "{{ worktree_path }}" --alias "{{ repo }}-{{ branch | sanitize }}" >/dev/null 2>&1
fi
'''

# Register the destination worktree as a herdr workspace so it shows up in the herdr TUI
# alongside the main checkout's workspace, instead of only existing as a plain git worktree
# on disk. post-switch (not post-start) is deliberate: post-start only fires when `wt switch
# --create` actually creates a worktree, so a plain `wt switch` back to one that already
# exists (the common case once you've got a handful of worktrees going, and previously a gap
# `coppice new` had to work around by re-running this hook itself in Python) would otherwise
# never (re-)register. post-switch fires on every switch result -- creating, switching to an
# existing worktree, or staying on the current one -- so this now keeps herdr in sync
# regardless of how the switch happened, `cop new`/`cop switch` or a bare `wt switch`.
#
# herdr's `worktree open --path` needs `--cwd {{ repo_path }}` (the MAIN checkout, not the
# destination worktree) to satisfy its "must act from the repo parent workspace" rule --
# passing the worktree's own path as --cwd fails with linked_worktree_source. --no-focus keeps
# this a silent background registration (like the registry/crg hooks above), matching the
# herdr entry list without stealing focus from wherever the switch was run; flip to --focus to
# auto-switch into the workspace on every switch instead.
[post-switch]
herdr = '''
if command -v herdr >/dev/null 2>&1; then
  herdr worktree open --cwd "{{ repo_path }}" --path "{{ worktree_path }}" --label "{{ repo }}-{{ branch | sanitize }}" --no-focus >/dev/null 2>&1 || true
fi
'''
# cop new --prompt (coppice#23): COP_PROMPT is set in wt's environment by `cop new -p`.
# Write the prompt to .cop-prompt in the worktree, drop a `runOn: folderOpen` task into the
# worktree's .vscode/tasks.json that runs `pi "<prompt>"` in a terminal when the window loads
# (then deletes the prompt file, and the tasks.json too if the hook wrote it), and open the
# window. post-switch (not post-start) so this fires on create AND on switching to an existing
# worktree. Reopening the folder later is a no-op: the prompt file is gone, and a fresh-written
# tasks.json deleted itself.
pi-prompt = '''
if [ -n "$COP_PROMPT" ] && command -v pi >/dev/null 2>&1; then
  wt="{{ worktree_path }}"
  printf '%s' "$COP_PROMPT" > "$wt/.cop-prompt"
  mkdir -p "$wt/.vscode"
  tj="$wt/.vscode/tasks.json"
  if [ -f "$tj" ] && command -v jq >/dev/null 2>&1 && jq -e . "$tj" >/dev/null 2>&1; then
    # Merge into the repo's own (plain-JSON) tasks.json: drop any previous task with our
    # label, append a fresh one. The file predates us and stays, so this command only
    # deletes the prompt file, not the tasks.json.
    cmd='p=$(cat "${workspaceFolder}/.cop-prompt" 2>/dev/null) || exit 0; [ -n "$p" ] || exit 0; rm -f "${workspaceFolder}/.cop-prompt"; pi "$p"'
    tmp=$(mktemp)
    jq --arg cmd "$cmd" '
      .tasks = ((.tasks // []) | map(select(.label != "cop: pi prompt")) + [{
        label: "cop: pi prompt",
        type: "shell",
        command: $cmd,
        runOptions: { runOn: "folderOpen" },
        presentation: { reveal: "always", focus: true, panel: "dedicated" },
        problemMatcher: []
      }])' "$tj" > "$tmp" && mv "$tmp" "$tj" || echo "cop: could not merge into $tj; prompt left at $wt/.cop-prompt" >&2
  elif [ ! -f "$tj" ]; then
    # Fresh write: the task deletes this tasks.json again after reading the prompt,
    # so reopening the folder later runs nothing at all.
    cat > "$tj" <<'TASKS'
{
  "version": "2.0.0",
  "tasks": [
    {
      "label": "cop: pi prompt",
      "type": "shell",
      "command": "p=$(cat \"${workspaceFolder}/.cop-prompt\" 2>/dev/null) || exit 0; [ -n \"$p\" ] || exit 0; rm -f \"${workspaceFolder}/.cop-prompt\" \"${workspaceFolder}/.vscode/tasks.json\"; pi \"$p\"",
      "runOptions": { "runOn": "folderOpen" },
      "presentation": { "reveal": "always", "focus": true, "panel": "dedicated" },
      "problemMatcher": []
    }
  ]
}
TASKS
  else
    # tasks.json exists but isn't plain JSON (JSONC with comments, most likely): jq can't
    # merge into it, so leave the prompt file in place and say so in wt's logs.
    echo "cop: $tj exists but is not plain JSON; prompt left at $wt/.cop-prompt" >&2
  fi
  code -n "$wt"
fi
'''

# Refuse to remove protected branches. pre-* hooks abort on non-zero exit.
# crg-cleanup deregisters the worktree from code-review-graph/its daemon before removal; always
# exits 0 so a code-review-graph hiccup never blocks a worktree removal.
[pre-remove]
protect = '''
case "{{ branch }}" in
  main|master|live) echo "refusing to remove protected branch: {{ branch }}" >&2; exit 1 ;;
esac
'''
crg-cleanup = '''
command -v crg-daemon >/dev/null 2>&1 && crg-daemon remove "{{ worktree_path }}" >/dev/null 2>&1
command -v code-review-graph >/dev/null 2>&1 && code-review-graph unregister "{{ worktree_path }}" >/dev/null 2>&1
exit 0
'''

# tardis-community: many independent dbt projects live under pipelines/<tribe>/<squad>/dbt.
# `wt step copy-ignored` (above) already reflinks each project's gitignored dbt_packages/ from
# the base worktree, so this only self-heals the rare case where that cache is still missing
# (first-ever worktree for a given dbt project, or base never ran `dbt deps`). Runs after the
# global post-start step above (project hooks append after user hooks).
[[projects."github.com/hellofresh/tardis-community".post-start]]
dbt-deps = '''
for f in "{{ worktree_path }}"/pipelines/*/*/dbt/dbt_project.yml; do
  [ -e "$f" ] || continue
  d=$(dirname "$f")
  [ -d "$d/dbt_packages" ] && continue
  ( cd "$d" && "{{ worktree_path }}/.venv/bin/dbt" deps )
done
'''
