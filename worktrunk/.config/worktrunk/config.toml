# Centralize every worktree under ~/worktrees instead of scattering them as siblings of each
# repo (would clutter shared dirs like ~/projects/hellofresh/) or nesting them inside the repo
# (risky on a shared monorepo like tardis-community without a local core.excludesFile on every
# machine).
#
# Branch as the PARENT segment and repo as the LEAF (not the more obvious owner/repo/branch) is
# deliberate: it keeps the paths human-readable and makes the repo name the final directory
# component. Current pi-hermes-memory resolves project memory inside Git from the basename of
# the repository root. For a linked worktree it follows the worktree's `.git` pointer and
# `commondir` back to the main checkout, so all linked worktrees share the main repo bucket
# regardless of where the worktree lives on disk. Outside Git, it falls back to basename(cwd),
# so the repo-as-leaf layout keeps that fallback consistent too. VS Code's title bar (below)
# carries the branch distinction, since the folder name no longer does.
# `owner` comes from the repo's remote URL (github.com/<owner>/<repo>), so it is UNDEFINED
# for remote-less repos and the template fails to expand there. `default('local')` buckets
# those under ~/worktrees/local/ instead (today only ~/projects/hellofresh/research and
# ~/projects/personal/sandbox). Repos with a remote are unaffected.
# Invariant the whole toolchain (wt, coppice, understory) depends on: the branch->path
# mapping is computed ONCE at creation by this template, with `sanitize` (lossy on
# purpose: pretty dir names; the rare collision, e.g. feature/foo vs feature-foo, fails
# loudly in `wt switch` and is resolved interactively by coppice's occupied-path remedy).
# Afterwards identity is always (repo, branch), read back from git's worktree metadata
# (`wt list --format json`); nothing may parse a path to recover a branch. Drift between
# an existing path and this template (template edit, manual `git switch` inside a
# worktree) is what `wt step relocate` / `cop relocate` heals.
worktree-path = "~/worktrees/{{ owner | default('local') }}/{{ branch | sanitize }}/{{ repo }}"

# Keep the default branch fresh before it becomes the base of a new worktree/branch -- the same
# habit as `gpull` (fetch + fast-forward), but scoped to worktree creation instead of a manual
# alias. Guarded on `target_worktree_path` being unset, since that's only true when `wt switch`
# is about to CREATE a worktree, not when switching between existing ones -- otherwise this would
# fire (and hit the network) on every `wt switch`. Deliberately targets the default branch, not
# `{{ base }}`: in a pre-switch hook, `base`/`base_worktree_path` mean "the worktree you're
# switching FROM", not "what the new branch will fork from" (that's only correct in pre-start,
# which fires after the worktree/branch already exists -- too late to freshen anything).
# worktree_path_of_branch() finds wherever the default branch is actually checked out (usually
# the main checkout, but not necessarily) and fast-forwards it there; falls back to updating the
# ref directly when nobody has it checked out. Best-effort (`|| true`): a flaky/offline fetch
# should never block creating a worktree, just skip the freshen.
# The fast-forward is `merge --ff-only origin/<default>`, NOT `pull --ff-only`: pull runs its
# own internal fetch, a second network round trip right after the explicit `fetch --prune`
# (~0.9s each against github.com, measured). Merging the just-fetched remote-tracking ref is
# the identical fast-forward with a single round trip, and it needs no upstream config.
[pre-switch]
sync-default = '''
{% if not target_worktree_path %}
{% set p = worktree_path_of_branch(default_branch) %}
{% if p %}
git -C "{{ p }}" fetch --prune && git -C "{{ p }}" merge --ff-only "origin/{{ default_branch }}" || true
{% else %}
git fetch origin "{{ default_branch }}:{{ default_branch }}" || true
{% endif %}
{% endif %}
'''

# .venv is symlinked (below); skip it in copy-ignored so we don't try to reflink it too.
[step.copy-ignored]
exclude = [".venv/", ".DS_Store"]

# Symlink .venv (shared, handled separately), copy other gitignored files (.vscode/settings.json,
# .env, etc.) via reflink, open the new worktree in VS Code, and register the repo so `coppice list`
# (or `coppice remove`) can find its worktrees later from anywhere.
[post-start]
venv = "ln -sfn {{ repo_path }}/.venv {{ worktree_path }}/.venv"
copy = "wt step copy-ignored --force"
vscode = 'code -n {{ worktree_path }}'
registry = "mkdir -p ~/.cache/wt && echo '{{ repo_path }}' >> ~/.cache/wt/known-repos && sort -u -o ~/.cache/wt/known-repos ~/.cache/wt/known-repos"
# pi/Claude discover AGENTS.md/CLAUDE.md by walking up from cwd to the filesystem root,
# concatenating every match along the way. From the main checkout ({{ repo_path }}, e.g.
# ~/projects/hellofresh/tardis-community) that walk passes through ~/projects/hellofresh/ and
# picks up its org-level AGENTS.md/CLAUDE.md. A worktree lives in a disjoint tree
# (~/worktrees/hellofresh/<branch>/tardis-community) whose walk-up never passes through
# ~/projects/hellofresh/, so that file is silently missing there.
#
# Fix: search upward from the main checkout's PARENT directory for the nearest AGENTS.md and
# CLAUDE.md, stopping at $HOME (whatever sits at/above $HOME is already found identically by
# both walks, since both the checkout and the worktree live under $HOME). Deliberately does not
# assume the file is exactly one level up -- some repos may be nested deeper (e.g. a subgroup
# directory) or have no such file at all, in which case this is a silent no-op. Whatever is
# found is symlinked into {{ owner }}'s worktree root (one level above every branch dir for this
# owner), which is exactly the directory pi's walk-up passes through for every worktree of every
# repo under this owner -- so this only needs to run (idempotently) once per owner, not per branch.
agents-md = '''
home="$HOME"
owner_dir=$(dirname "$(dirname "{{ worktree_path }}")")
for name in AGENTS.md CLAUDE.md; do
  dir=$(dirname "{{ repo_path }}")
  found=""
  while [ "$dir" != "$home" ] && [ "$dir" != "/" ]; do
    if [ -f "$dir/$name" ]; then
      found="$dir/$name"
      break
    fi
    parent=$(dirname "$dir")
    [ "$parent" = "$dir" ] && break
    dir="$parent"
  done
  [ -n "$found" ] && ln -sf "$found" "$owner_dir/$name"
done
'''
# Refuse to remove protected branches. pre-* hooks abort on non-zero exit.
[pre-remove]
protect = '''
case "{{ branch }}" in
  main|master|live) echo "refusing to remove protected branch: {{ branch }}" >&2; exit 1 ;;
esac
'''
# wt remove deletes <owner>/<branch>/<repo> but leaves the empty <branch> parent dir behind
# (e.g. ~/worktrees/hellofresh/fix-thing/). Prune it. rmdir only removes EMPTY dirs, so a
# branch dir that still holds another repo's worktree is left alone; the error is swallowed
# (macOS rmdir has no --ignore-fail-on-non-empty).
[post-remove]
prune-empty-branch-dir = 'rmdir "{{ worktree_path | dirname }}" 2>/dev/null || true'
# tardis-community: many independent dbt projects live under pipelines/<tribe>/<squad>/dbt.
# `wt step copy-ignored` (above) already reflinks each project's gitignored dbt_packages/ from
# the base worktree, so this only self-heals the rare case where that cache is still missing
# (first-ever worktree for a given dbt project, or base never ran `dbt deps`). Runs after the
# global post-start step above (project hooks append after user hooks).
[[projects."github.com/hellofresh/tardis-community".post-start]]
dbt-deps = '''
for f in "{{ worktree_path }}"/pipelines/*/*/dbt/dbt_project.yml; do
  [ -e "$f" ] || continue
  d=$(dirname "$f")
  [ -d "$d/dbt_packages" ] && continue
  ( cd "$d" && "{{ worktree_path }}/.venv/bin/dbt" deps )
done
'''

# global-ops: `wt step copy-ignored` (above) reflinks .env.dev from the base worktree, but that
# file carries ABSOLUTE machine paths of the checkout it was written in (REPO_ROOT, CHANGE_PATH,
# DBT_PROFILES_DIR). Left stale, `make test` in the worktree would load pytest-env from the copied
# .env.dev and run the schemachange tests against the MAIN checkout's SQL, silently testing the
# wrong tree. `make setup-env` is the repo's own non-destructive fix: it preserves all secrets
# (backs up to .env.dev.bak) and rewrites only those three paths to the worktree. Best-effort: a
# failure (e.g. make/databricks missing) must never block worktree creation.
[[projects."github.com/hellofresh/global-ops".post-start]]
setup-env = 'make -C "{{ worktree_path }}" setup-env || true'
